<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel — the developer platform</title>
<style>
  :root {
    --acid: #ccff00;
    --ink: #f4f4ef;
    --font: ui-sans-serif, system-ui, sans-serif;
  }
  body { margin: 0; background: #0b0b0b; color: var(--ink); font-family: var(--font); }
  main { max-width: 1080px; margin: 0 auto; padding: 56px 24px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; color: var(--acid); }
  .label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
  h1 { font-size: 64px; line-height: 1; margin: 8px 0 20px; }
  .btn { display: inline-block; padding: 12px 20px; background: var(--acid); color: #0b0b0b; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">THE PLATFORM</p>
  <h1>Ship infrastructure like a product team.</h1>
  <p class="label">REGION · LATENCY · STATUS</p>
  <p><span class="label" style="font-family: ui-monospace, monospace">v1.0</span> shipped this week.</p>
  <p>Deploy from a branch. Watch the rollout. Roll back in one command when the graph turns red.</p>
  <p>Every environment gets its own preview URL and its own budget guard.</p>
  <a class="btn" href="/signup">Start free →</a>
  <a class="btn" href="/pricing">View pricing →</a>
</main>
</body>
</html>

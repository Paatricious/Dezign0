name: validate

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - name: Check capability manifest and docs
        run: node scripts/check-docs.mjs
      - name: CLI smoke test
        run: node bin/dezign0.test.mjs
